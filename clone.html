<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3.3: Google Homepage Clone</title>
    <!-- Links to your active stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Corner Header Navigation Grid -->
    <header class="clone-header">
        <div class="header-right-links">
            <a href="https://google.com">Gmail</a>
            <a href="https://google.com">Images</a>
            <button class="apps-icon-btn">⠿</button>
            <button class="signin-btn">Sign in</button>
        </div>
    </header>

    <!-- Main Central Search Block Container -->
    <main class="clone-main-container">
        <!-- Replicating the core centralized logo branding shape -->
        <div class="branding-logo-box">
            <span class="logo-g">G</span>
            <span class="logo-o1">o</span>
            <span class="logo-o2">o</span>
            <span class="logo-g2">g</span>
            <span class="logo-l">l</span>
            <span class="logo-e">e</span>
        </div>

        <!-- Input Frame Element Box Wrapper -->
        <div class="search-input-box-wrapper">
            <span class="search-lens-icon">🔍</span>
            <input type="text" class="search-bar-input-field" aria-label="Search" placeholder="Search Google or type a URL">
            <span class="mic-icon">🎙️</span>
        </div>

        <!-- Center Selection Buttons Row -->
        <div class="search-button-action-row">
            <button class="clone-action-btn">Google Search</button>
            <button class="clone-action-btn">I'm Feeling Lucky</button>
        </div>

        <!-- Language Availability Text Node Links -->
        <p class="languages-offered-text">Google offered in: <a href="#">Hausa</a> <a href="#">Igbo</a> <a href="#">Yoruba</a> <a href="#">Pidgin</a></p>
    </main>

</body>
</html>
