<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Heading -->
    <h1>Contact Our Team</h1>
    <p>Please fill out the form below to get in touch with us. All fields are required.</p>

    <!-- Contact Form Container -->
    <form action="#" method="POST">
        
        <!-- Full Name Input Field -->
        <p>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </p>

        <!-- Email Address Input Field -->
        <p>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </p>

        <!-- Subject Selection Dropdown -->
        <p>
            <label for="subject">Reason for Contact:</label>
            <select id="subject" name="subject" required>
                <option value="">-- Please choose an option --</option>
                <option value="general">General Inquiry</option>
                <option value="support">Technical Support</option>
                <option value="feedback">Website Feedback</option>
            </select>
        </p>

        <!-- Message Textarea Box -->
        <p>
            <label for="message">Your Message:</label><br>
            <textarea id="message" name="message" rows="5" cols="40" placeholder="Type your message here..." required></textarea>
        </p>

        <!-- Submit Button -->
        <p>
            <button type="submit">Send Message</button>
        </p>

    </form>

</body>
</html>
